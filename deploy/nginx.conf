# NovaNest - nginx reverse proxy (Hostinger VPS / Cloud, non-Docker setups)
#
# Install:   sudo apt install nginx certbot python3-certbot-nginx
# Setup:     sudo cp deploy/nginx.conf /etc/nginx/sites-available/novanest
#            sudo ln -s /etc/nginx/sites-available/novanest /etc/nginx/sites-enabled/
#            sudo nginx -t && sudo systemctl reload nginx
# HTTPS:     sudo certbot --nginx -d shop.example.com
#
# Replace shop.example.com with your real domain (and the proxy port if you
# changed PORT in backend/.env).

server {
    listen 80;
    server_name shop.example.com;

    # Uploads can be large (product photos).
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
